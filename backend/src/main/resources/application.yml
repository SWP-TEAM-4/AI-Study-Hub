spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aistudyhub
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:60MB}

  # ===== Config server gửi email (Không sửa nha) =====
  mail:
    host: mail.tino.vn
    port: 587
    username: contact@huyplay.vn
    password: 'dfhfDSFDHdgh45@fgjf@dgjdf'
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: mail.tino.vn
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000
        debug: true

server:
  port: ${SERVER_PORT:8080}

# ===== App Config =====
app:
  jwt:
    secret: ${JWT_SECRET:ai-study-hub-jwt-secret-key-for-hs256-must-be-at-least-256bits-long}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000} # 7 days

  storage:
    type: ${STORAGE_TYPE:local}
    local-path: ${LOCAL_STORAGE_PATH:./uploads}
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/files}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

  mail:
    from: contact@huyplay.vn
    from-name: AI Study Hub
    reset-password-url: ${FRONTEND_URL:http://localhost:3000}/reset-password
    token-expire-minutes: 30

# ===== Logging =====
logging:
  level:
    com.aistudyhub: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ===== Springdoc / Swagger =====
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
