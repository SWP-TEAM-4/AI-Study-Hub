spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aistudyhub
    username: postgres
    password: huyplay
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    ignore-migration-patterns: versioned:missing

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:60MB}

  # ===== Config server gửi email (Không sửa nha) =====
  mail:
    host: mail.tino.vn
    port: 587
    username: contact@huyplay.vn
    password: "dfhfDSFDHdgh45@fgjf@dgjdf"
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: mail.tino.vn
          connectiontimeout: 10000
          timeout: 15000
          writetimeout: 15000
        debug: true

server:
  port: ${SERVER_PORT:8080}

